---
- name: Prepare all Kolla target hosts
  hosts: all
  become: true
  gather_facts: true
  vars:
    swap_size_gib: "{{ lookup('env', 'GUEST_SWAP_GIB') | default('2', true) }}"
  tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("24.04", ">=")
          - ansible_architecture == "x86_64"
        fail_msg: >-
          {{ lookup('env', 'ENVIRONMENT_NAME') }} requires Ubuntu 24.04 or
          newer on x86_64; got
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          {{ ansible_architecture }}

    - name: Install common host packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - ca-certificates
          - chrony
          - cloud-guest-utils
          - curl
          - file
          - git
          - iptables
          - jq
          - openssh-client
          - python3
          - python3-apt
          - python3-docker
          - python3-libvirt
          - python3-venv
          - rsync
        state: present

    - name: Set the declared host name
      ansible.builtin.hostname:
        name: "{{ node_hostname }}"

    - name: Load persistent bridge modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/openstack-k8s.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          br_netfilter
          overlay

    - name: Load bridge modules now
      ansible.builtin.command: "modprobe {{ item }}"
      changed_when: false
      loop:
        - br_netfilter
        - overlay

    - name: Configure host kernel networking
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-openstack-k8s.conf
      loop:
        - { name: net.ipv4.ip_forward, value: "1" }
        - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { name: vm.swappiness, value: "10" }

    - name: Enable time synchronization
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started

    - name: Check whether UFW is installed
      ansible.builtin.stat:
        path: /usr/sbin/ufw
      register: ufw_binary

    - name: Disable UFW in the isolated evaluation guests
      community.general.ufw:
        state: disabled
      when: ufw_binary.stat.exists

    - name: Configure project swap
      ansible.builtin.include_tasks: tasks/swap.yml

    - name: Install deterministic host mappings
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} OPENSTACK-K8S MANAGED HOSTS"
        block: |
          {% for host in groups['all'] %}
          {{ hostvars[host]['ansible_host'] }} {{ hostvars[host]['node_hostname'] }} {{ host }}
          {% endfor %}

- name: Prepare controller external networking
  hosts: controller
  become: true
  gather_facts: true
  tasks:
    - name: Install external networking setup script
      ansible.builtin.template:
        src: ../templates/openstack-external-network.sh.j2
        dest: /usr/local/sbin/openstack-external-network
        owner: root
        group: root
        mode: "0755"
      notify: Apply external networking

    - name: Install external networking systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/openstack-external-network.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=OpenStack evaluation external veth and NAT
          Wants=network-online.target
          After=network-online.target
          Before=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/openstack-external-network start
          ExecStop=/usr/local/sbin/openstack-external-network stop

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Enable and start external networking
      ansible.builtin.systemd:
        name: openstack-external-network.service
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Apply external networking
      ansible.builtin.command: /usr/local/sbin/openstack-external-network start
      changed_when: true

- name: Verify nested KVM on compute
  hosts: compute
  become: true
  gather_facts: true
  tasks:
    - name: Install x86 KVM verification packages
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name: qemu-system-x86
        state: present

    - name: Load nested KVM module
      ansible.builtin.command: modprobe kvm_intel
      changed_when: false

    - name: Read nested KVM setting
      ansible.builtin.slurp:
        src: /sys/module/kvm_intel/parameters/nested
      register: nested_kvm_setting

    - name: Require nested KVM acceleration
      ansible.builtin.assert:
        that:
          - (nested_kvm_setting.content | b64decode | trim) == "Y"
        fail_msg: Nested KVM is not enabled in the GCP compute host.

    - name: Stop host libvirt units before using containerized libvirt
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - libvirtd.service
        - libvirtd.socket
        - libvirtd-ro.socket
        - libvirtd-admin.socket
        - virtlogd.socket
        - virtlockd.socket

    - name: Remove host libvirt packages
      ansible.builtin.apt:
        name:
          - libvirt-clients
          - libvirt-daemon-system
        state: absent
        purge: true

    - name: Require the KVM character device
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_device

    - name: Stop when nested KVM is unavailable
      ansible.builtin.assert:
        that:
          - kvm_device.stat.exists
          - kvm_device.stat.ischr | default(false)
        fail_msg: >-
          /dev/kvm is unavailable in the GCP compute host. Per the selected
          policy, deployment stops here instead of falling back to QEMU TCG.

    - name: Install nested KVM boot verifier
      ansible.builtin.copy:
        src: ../files/verify-nested-kvm.sh
        dest: /usr/local/sbin/verify-nested-kvm
        owner: root
        group: root
        mode: "0755"

    - name: Boot the host kernel in a nested KVM VM
      ansible.builtin.command: /usr/local/sbin/verify-nested-kvm
      changed_when: false
