#cloud-config
write_files:
  - path: /etc/systemd/system/capo-api-probe.service
    permissions: "0644"
    content: |
      [Unit]
      Description=CAPO preflight API reachability probe
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/python3 -m http.server 6443 --bind 0.0.0.0
      Restart=always

      [Install]
      WantedBy=multi-user.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, capo-api-probe.service]
