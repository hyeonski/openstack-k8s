apiVersion: v1
kind: Namespace
metadata:
  name: graduation-s4
  labels:
    openstack-k8s.dev/experiment: graduation-s4
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: http-content
  namespace: graduation-s4
  labels:
    openstack-k8s.dev/experiment: graduation-s4
data:
  healthz: "ok\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http
  namespace: graduation-s4
  labels:
    openstack-k8s.dev/experiment: graduation-s4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: graduation-s4-http
  template:
    metadata:
      labels:
        app: graduation-s4-http
        openstack-k8s.dev/experiment: graduation-s4
    spec:
      terminationGracePeriodSeconds: 5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 30
      containers:
      - name: http
        image: busybox:1.37.0
        command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 3
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
        volumeMounts:
        - name: content
          mountPath: /www
          readOnly: true
      volumes:
      - name: content
        configMap:
          name: http-content
---
apiVersion: v1
kind: Service
metadata:
  name: http
  namespace: graduation-s4
  labels:
    openstack-k8s.dev/experiment: graduation-s4
spec:
  selector:
    app: graduation-s4-http
  ports:
  - name: http
    port: 8080
    targetPort: http
