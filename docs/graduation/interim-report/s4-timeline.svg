<line x1="20" y1="383" x2="1180" y2="383" class="grid"/>
<text x="24" y="410" class="legend">서비스: F 첫 HTTP 실패 · N Node Unknown · P 대체 Pod Ready · H HTTP 30초 연속 성공 확인</text>
<text x="24" y="437" class="legend">인프라: V SHUTOFF · M MHC 삭제 시작 · C 새 Machine 첫 관측 · R 새 Node Ready 첫 관측</text>
<text x="24" y="459" class="legend">T 새 워커 시험 Pod Ready 첫 관측 · W 워커 안정화 확인 (C·R·T는 실제 발생 시각이 아닌 첫 관측 시각)</text>
</svg>
