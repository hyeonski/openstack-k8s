<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">S4 세 회차의 복구 사건 시간선</title>
<desc id="desc">각 회차의 Nova 중단 요청을 0초로 정렬한 서비스와 인프라 사건 관측 시간선이다. 세 회차 모두 첫 HTTP 실패와 Node Unknown 뒤에 SHUTOFF가 확인됐다. 사건의 시작점이 다른 서비스·용량 시간은 서로 빼서 비교하지 않는다.</desc>
<style>text{font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif;fill:#183247}.title{font-size:21px;font-weight:700}.note{font-size:15px;font-weight:700;fill:#a04e2d}.axis{font-size:14px;fill:#536778}.run{font-size:16px;font-weight:700}.lane{font-size:13px;fill:#526878}.mark{font-size:13px;font-weight:700;fill:white}.legend{font-size:14px}.grid{stroke:#dce5eb;stroke-width:1}.base{stroke:#718b9d;stroke-width:2}.stop{stroke:#425466;stroke-width:2;stroke-dasharray:4 4}.blue{fill:#2374a8}.green{fill:#39805a}</style>
